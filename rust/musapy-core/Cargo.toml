[package]
name = "musapy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
# 启用 stream-ordered alloc/free 路径（musaMallocAsync/musaFreeAsync）。
# 仅 MUSA SDK 5.x+ 可用：3.x/4.x 的 libmusart.so 不导出这些符号。
# 默认路径（deferred-free + musaMalloc/musaFree）适用所有 SDK 版本（ADR L3-9, L3-11）。
stream-ordered = []

[dependencies]
thiserror.workspace = true
parking_lot.workspace = true

[build-dependencies]
pkg-config = "0.3"