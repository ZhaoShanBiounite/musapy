[package]
name = "musapy-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module"] }
# math-libs：句柄冒烟测试 _math_handle_smoke 依赖 musapy-core::math_handle。
musapy-core = { workspace = true, features = ["math-libs"] }
musapy-ops = { workspace = true }